<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026级新生智能化宿舍竞选结果查询</title>
<style>
  :root {
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --primary-light: #eff6ff;
    --success: #16a34a;
    --success-light: #f0fdf4;
    --danger: #dc2626;
    --danger-light: #fef2f2;
    --text: #1e293b;
    --text-light: #64748b;
    --border: #e2e8f0;
    --bg: #f1f5f9;
    --card: #ffffff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: linear-gradient(160deg, #dbeafe 0%, var(--bg) 40%);
    min-height: 100vh;
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 16px 60px;
  }
  .container { width: 100%; max-width: 560px; }

  /* 头部 */
  .header { text-align: center; margin-bottom: 28px; }
  .badge {
    display: inline-block;
    background: var(--primary);
    color: #fff;
    font-size: 13px;
    padding: 6px 16px;
    border-radius: 999px;
    letter-spacing: 2px;
    margin-bottom: 16px;
    box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
  }
  .header h1 {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 1px;
    color: var(--primary-dark);
  }
  .header p {
    margin-top: 10px;
    color: var(--text-light);
    font-size: 14px;
  }

  /* 卡片 */
  .card {
    background: var(--card);
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
    padding: 28px 24px;
    margin-bottom: 20px;
  }

  /* 输入区 */
  .search-box { display: flex; gap: 10px; }
  .search-box input {
    flex: 1;
    padding: 14px 16px;
    font-size: 18px;
    letter-spacing: 3px;
    border: 2px solid var(--border);
    border-radius: 12px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    font-family: inherit;
  }
  .search-box input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
  }
  .search-box input::placeholder { letter-spacing: 1px; font-size: 14px; color: #94a3b8; }
  .search-box button {
    padding: 0 28px;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
    font-family: inherit;
  }
  .search-box button:hover { background: var(--primary-dark); }
  .search-box button:active { transform: scale(0.97); }
  .search-box button:disabled { background: #93c5fd; cursor: not-allowed; }
  .tip {
    margin-top: 12px;
    font-size: 12.5px;
    color: var(--text-light);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .tip svg { flex-shrink: 0; }

  /* 结果 */
  .result { display: none; border-radius: 12px; padding: 22px 20px; margin-top: 20px; }
  .result.show { display: block; animation: fadeIn 0.35s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  .result.success { background: var(--success-light); border: 1.5px solid #bbf7d0; }
  .result.fail { background: var(--danger-light); border: 1.5px solid #fecaca; }

  .result-icon { width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 14px; }
  .result.success .result-icon { background: #dcfce7; }
  .result.fail .result-icon { background: #fee2e2; }

  .result-title { text-align: center; font-size: 20px; font-weight: 700; }
  .result.success .result-title { color: var(--success); }
  .result.fail .result-title { color: var(--danger); }

  .result-sub { text-align: center; color: var(--text-light); font-size: 13px; margin-top: 6px; }

  .detail { margin-top: 16px; border-top: 1px dashed var(--border); padding-top: 14px; }
  .detail-row { display: flex; justify-content: space-between; padding: 7px 4px; font-size: 15px; }
  .detail-row .label { color: var(--text-light); }
  .detail-row .value { font-weight: 600; }

  /* 统计 */
  .stats { display: flex; justify-content: space-between; gap: 10px; }
  .stat-item {
    flex: 1;
    background: var(--primary-light);
    border-radius: 12px;
    padding: 14px 8px;
    text-align: center;
  }
  .stat-item .num { font-size: 22px; font-weight: 700; color: var(--primary-dark); }
  .stat-item .txt { font-size: 12px; color: var(--text-light); margin-top: 4px; }

  /* 底部 */
  .footer { text-align: center; color: #94a3b8; font-size: 12px; margin-top: 12px; line-height: 1.8; }

  /* 响应式 */
  @media (max-width: 480px) {
    body { padding: 24px 12px 40px; }
    .header h1 { font-size: 21px; }
    .card { padding: 22px 16px; }
    .search-box { flex-direction: column; }
    .search-box button { padding: 13px 0; }
  }
</style>
</head>

</div>

// 统计信息
const colleges = new Set(Object.values(DATA).map(v => v[2]));
document.getElementById('statTotal').textContent = Object.keys(DATA).length;
document.getElementById('statCollege').textContent = colleges.size;

const input = document.getElementById('input');
const btn = document.getElementById('btn');
const result = document.getElementById('result');
const resultIcon = document.getElementById('resultIcon');
const resultTitle = document.getElementById('resultTitle');
const resultSub = document.getElementById('resultSub');
const detail = document.getElementById('detail');

// 仅允许数字输入
input.addEventListener('input', function() {
  this.value = this.value.replace(/\D/g, '');
  if (this.value.length === 10) doSearch(this.value);
});

// 查询
function doSearch(num) {
  const record = DATA[num];
  if (record) {
    const [seq, name, college] = record;
    result.className = 'result success show';
    resultIcon.innerHTML = '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';
    resultTitle.textContent = '恭喜！您已入选';
    resultSub.textContent = '您已通过智能化宿舍竞选，成功入选';
    detail.innerHTML =
      '<div class="detail-row"><span class="label">姓名</span><span class="value">' + name + '</span></div>' +
      '<div class="detail-row"><span class="label">录取通知书号</span><span class="value">' + num + '</span></div>' +
      '<div class="detail-row"><span class="label">所属学院</span><span class="value">' + college + '</span></div>' +
      '<div class="detail-row"><span class="label">公示序号</span><span class="value">第' + seq + '号</span></div>';
  } else {
    result.className = 'result fail show';
    resultIcon.innerHTML = '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M15 9l-6 6M9 9l6 6"/></svg>';
    resultTitle.textContent = '未查询到入选记录';
    resultSub.textContent = '该通知书号不在本次公示名单中';
    detail.innerHTML = '';
  }
  result.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

btn.addEventListener('click', function() {
  const v = input.value.trim();
  if (!v) { input.focus(); return; }
  if (v.length !== 10) {
    result.className = 'result fail show';
    resultIcon.innerHTML = '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M15 9l-6 6M9 9l6 6"/></svg>';
    resultTitle.textContent = '通知书号格式不正确';
    resultSub.textContent = '请输入完整的10位数字通知书号';
    detail.innerHTML = '';
    return;
  }
  doSearch(v);
});

input.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') btn.click();
});
</script>
